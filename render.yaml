# Supabase hosts PostgreSQL. This Blueprint creates only a free web service.
services:
  - type: web
    name: crowdcue
    runtime: node
    plan: free
    repo: https://github.com/cbertrand451/CrowdCue
    branch: codex/crowdcue-build
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:cloud
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: 'true'
      - key: SPOTIFY_AUTH_ENABLED
        value: 'true'
      - key: TOKEN_ENCRYPTION_KEY_ID
        value: v1
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
